name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/uxpin-merge-cli

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: packages/uxpin-merge-cli/node_modules
          key: ${{ runner.os }}-uxpin-merge-cli-deps-${{ hashFiles('packages/uxpin-merge-cli/package.json') }}

      - name: Install dependencies
        run: make dependencies

      - name: Cache test repositories
        uses: actions/cache@v4
        with:
          path: packages/uxpin-merge-cli/test/resources/repos
          key: ${{ runner.os }}-uxpin-merge-cli-test-repos-${{ hashFiles('packages/uxpin-merge-cli/shell_scripts/test_resources/Makefile') }}

      - name: Allow cloning git dependencies from GitHub
        run: mkdir -p ~/.ssh/ && echo -e "Host github.com\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Create test resources
        run: make test-resources

      - name: Check
        run: make check

      - name: Build
        run: make build

      - name: Test
        run: make test-ci
        timeout-minutes: 30
        env:
          CHROME_PATH: /usr/bin/google-chrome
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: packages/uxpin-merge-cli/reports
